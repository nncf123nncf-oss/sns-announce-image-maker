<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNS告知画像メーカー</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #C9DED8;
    --surface: #FFFFFF;
    --text: #1E332E;
    --text-sub: #3F5651;
    --accent: #2F6B5C;
    --danger: #C0392B;
    --border: #B7D1CA;
  }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lead { font-size: 14px; color: var(--text-sub); margin: 0 0 24px; }
  .field { margin-bottom: 16px; }
  label, .group-label { display: block; font-size: 14px; color: var(--text-sub); margin-bottom: 8px; }
  .hint { font-size: 12px; color: var(--text-sub); margin: 8px 0 0; }
  input[type="text"], textarea {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
  }
  textarea { min-height: 88px; resize: vertical; }
  .preview { margin-bottom: 16px; }
  canvas {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
  }
  .swatches {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .swatch {
    aspect-ratio: 1 / 1;
    min-height: 44px;
    border: 1px solid var(--text-sub);
    border-radius: 6px;
    padding: 0;
    cursor: pointer;
  }
  .swatch[aria-pressed="true"] {
    box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 6px var(--text);
  }
  .swatch:focus-visible, .toggle button:focus-visible, #download:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .toggle { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .toggle button {
    min-height: 44px;
    font-family: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
  }
  .toggle button[aria-pressed="true"] {
    box-shadow: inset 0 0 0 3px var(--accent);
    color: var(--accent);
    font-weight: 700;
  }
  .chip {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-right: 8px;
    vertical-align: -3px;
  }
  #download {
    display: block;
    width: 100%;
    min-height: 44px;
    margin-top: 24px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    color: var(--surface);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    cursor: pointer;
  }
  #error { color: var(--danger); font-size: 14px; margin: 8px 0 0; min-height: 0; }
  footer { margin-top: 24px; font-size: 12px; color: var(--text-sub); }
</style>
</head>
<body>
<div class="wrap">
  <h1>SNS告知画像メーカー</h1>
  <p class="lead">告知文・日付・店名を入れると、SNSにそのまま出せる正方形（1080×1080）の告知画像を作れます。</p>

  <div class="field">
    <label for="message">告知文（1行12文字で折り返し・最大6行）</label>
    <textarea id="message" placeholder="例: 本日は臨時休業いたします">本日は臨時休業いたします</textarea>
    <p class="hint">6行を超えた分は画像に入りません（末尾が「…」になります）。</p>
  </div>

  <div class="field">
    <label for="date">日付（20文字まで）</label>
    <input type="text" id="date" maxlength="20" placeholder="例: 9月5日（土）" value="9月5日（土）">
  </div>

  <div class="field">
    <label for="shop">店名（20文字まで）</label>
    <input type="text" id="shop" maxlength="20" placeholder="例: サンプル商店" value="サンプル商店">
  </div>

  <div class="preview">
    <canvas id="canvas" width="1080" height="1080" role="img" aria-label="告知画像のプレビュー"></canvas>
  </div>

  <div class="field">
    <span class="group-label" id="bg-label">背景色</span>
    <div class="swatches" id="swatches" role="group" aria-labelledby="bg-label"></div>
  </div>

  <div class="field">
    <span class="group-label" id="fg-label">文字色</span>
    <div class="toggle" id="toggle" role="group" aria-labelledby="fg-label">
      <button type="button" data-mode="tone" aria-pressed="true"><span class="chip" id="chip-tone"></span>色にあわせる</button>
      <button type="button" data-mode="black" aria-pressed="false"><span class="chip" style="background:#111111"></span>黒</button>
    </div>
  </div>

  <button type="button" id="download">画像をダウンロード（PNG）</button>
  <p class="hint">保存できないときは、上のプレビュー画像を長押し（パソコンでは右クリック）して保存してください。</p>
  <p id="error" role="status"></p>

  <footer>入力内容はこのページの中だけで処理され、どこにも送信・保存されません。</footer>
</div>

<script>
(function () {
  "use strict";

  // 背景はペールトーン。文字は同じ色相の濃い色を組にする
  // （ペール背景に白文字はコントラスト1.2前後で読めないため、白は文字色に使わない）
  var BG_COLORS = [
    { bg: "#F7DAD3", ink: "#8C3A2A", name: "ペールコーラル" },
    { bg: "#DCEBDF", ink: "#2E5D40", name: "ペールセージ" },
    { bg: "#DAE4F2", ink: "#2C4470", name: "ペールブルー" },
    { bg: "#F7ECCF", ink: "#7A5A1E", name: "ペールイエロー" },
    { bg: "#E4E4E6", ink: "#33343A", name: "ペールグレー" }
  ];

  var BLACK = "#111111";
  var PANEL = "#FFFFFF";

  var SIZE = 1080;
  var CHARS_PER_LINE = 12;
  var MAX_LINES = 6;
  var MAX_META_CHARS = 20;

  var MSG_FONT = 64;
  var LINE_HEIGHT = 84;
  var MSG_CENTER_Y = 350;

  var FRAME_INSET = 40;
  var FRAME_WIDTH = 3;

  var PANEL_X0 = 90, PANEL_Y0 = 640, PANEL_X1 = 990, PANEL_Y1 = 950, PANEL_RADIUS = 24;
  var DATE_FONT = 56, DATE_Y = 750;
  var SHOP_FONT = 48, SHOP_Y = 855;
  var PANEL_PADDING = 40;
  var MIN_META_FONT = 28;

  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");
  var messageEl = document.getElementById("message");
  var dateEl = document.getElementById("date");
  var shopEl = document.getElementById("shop");
  var swatchesEl = document.getElementById("swatches");
  var toggleEl = document.getElementById("toggle");
  var chipTone = document.getElementById("chip-tone");
  var downloadEl = document.getElementById("download");
  var errorEl = document.getElementById("error");

  var state = { index: 0, mode: "tone" };

  function current() { return BG_COLORS[state.index]; }
  function inkColor() { return state.mode === "black" ? BLACK : current().ink; }

  // 絵文字などのサロゲートペアを分断しないよう、コードポイント単位の配列にする
  function toChars(text) {
    return Array.from(String(text));
  }

  // 告知文を「1行12文字」の固定ルールで分割する（改行はそのまま行区切りとして扱う）
  function wrapLines(text) {
    var lines = [];
    var paragraphs = String(text).split(/\r?\n/);
    for (var p = 0; p < paragraphs.length && lines.length <= MAX_LINES; p++) {
      var chars = toChars(paragraphs[p]);
      if (chars.length === 0) {
        lines.push("");
        continue;
      }
      for (var i = 0; i < chars.length && lines.length <= MAX_LINES; i += CHARS_PER_LINE) {
        lines.push(chars.slice(i, i + CHARS_PER_LINE).join(""));
      }
    }
    if (lines.length > MAX_LINES) {
      lines = lines.slice(0, MAX_LINES);
      var last = toChars(lines[MAX_LINES - 1]);
      lines[MAX_LINES - 1] = last.slice(0, Math.max(0, CHARS_PER_LINE - 1)).join("") + "…";
    }
    return lines;
  }

  function clampMeta(text) {
    var chars = toChars(text);
    return chars.length > MAX_META_CHARS ? chars.slice(0, MAX_META_CHARS).join("") : chars.join("");
  }

  // 白パネルの内側（左右に40pxずつ余白）に収まるまで文字サイズを下げる
  function fitFont(text, baseSize, bold) {
    var maxWidth = (PANEL_X1 - PANEL_X0) - PANEL_PADDING * 2;
    var size = baseSize;
    var face = "px system-ui, -apple-system, 'Segoe UI', sans-serif";
    while (size > MIN_META_FONT) {
      ctx.font = (bold ? "bold " : "") + size + face;
      if (ctx.measureText(text).width <= maxWidth) { break; }
      size -= 2;
    }
    return (bold ? "bold " : "") + size + face;
  }

  function roundRect(x0, y0, x1, y1, r) {
    ctx.beginPath();
    ctx.moveTo(x0 + r, y0);
    ctx.lineTo(x1 - r, y0);
    ctx.quadraticCurveTo(x1, y0, x1, y0 + r);
    ctx.lineTo(x1, y1 - r);
    ctx.quadraticCurveTo(x1, y1, x1 - r, y1);
    ctx.lineTo(x0 + r, y1);
    ctx.quadraticCurveTo(x0, y1, x0, y1 - r);
    ctx.lineTo(x0, y0 + r);
    ctx.quadraticCurveTo(x0, y0, x0 + r, y0);
    ctx.closePath();
  }

  function draw() {
    var ink = inkColor();

    // 1層目: 選んだ色のベタ塗り＋細い枠線
    ctx.fillStyle = current().bg;
    ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.strokeStyle = ink;
    ctx.lineWidth = FRAME_WIDTH;
    ctx.strokeRect(FRAME_INSET, FRAME_INSET,
                   SIZE - FRAME_INSET * 2, SIZE - FRAME_INSET * 2);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // 見出し（告知文）は色ベタの上に置く
    var lines = wrapLines(messageEl.value);
    var blockTop = MSG_CENTER_Y - ((lines.length - 1) * LINE_HEIGHT) / 2;
    ctx.fillStyle = ink;
    ctx.font = "bold " + MSG_FONT + "px system-ui, -apple-system, 'Segoe UI', sans-serif";
    for (var i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], SIZE / 2, blockTop + i * LINE_HEIGHT);
    }

    // 2層目: 白いパネル。日付と店名はこの上に置く
    roundRect(PANEL_X0, PANEL_Y0, PANEL_X1, PANEL_Y1, PANEL_RADIUS);
    ctx.fillStyle = PANEL;
    ctx.fill();
    ctx.strokeStyle = ink;
    ctx.lineWidth = FRAME_WIDTH;
    ctx.stroke();

    var dateText = clampMeta(dateEl.value);
    var shopText = clampMeta(shopEl.value);
    ctx.fillStyle = ink;
    ctx.font = fitFont(dateText, DATE_FONT, true);
    ctx.fillText(dateText, SIZE / 2, DATE_Y);
    ctx.font = fitFont(shopText, SHOP_FONT, false);
    ctx.fillText(shopText, SIZE / 2, SHOP_Y);

    canvas.setAttribute("aria-label",
      "告知画像のプレビュー: " + lines.join(" ") + " " + dateText + " " + shopText);

    chipTone.style.background = current().ink;
  }

  function buildSwatches() {
    for (var i = 0; i < BG_COLORS.length; i++) {
      (function (color, index) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "swatch";
        b.style.background = color.bg;
        b.setAttribute("aria-label", color.name);
        b.setAttribute("aria-pressed", index === state.index ? "true" : "false");
        b.addEventListener("click", function () {
          state.index = index;
          var all = swatchesEl.querySelectorAll(".swatch");
          for (var j = 0; j < all.length; j++) {
            all[j].setAttribute("aria-pressed", all[j] === b ? "true" : "false");
          }
          draw();
        });
        swatchesEl.appendChild(b);
      })(BG_COLORS[i], i);
    }
  }

  toggleEl.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("button[data-mode]") : null;
    if (!btn) { return; }
    state.mode = btn.getAttribute("data-mode");
    var all = toggleEl.querySelectorAll("button[data-mode]");
    for (var j = 0; j < all.length; j++) {
      all[j].setAttribute("aria-pressed", all[j] === btn ? "true" : "false");
    }
    draw();
  });

  messageEl.addEventListener("input", draw);
  dateEl.addEventListener("input", draw);
  shopEl.addEventListener("input", draw);

  downloadEl.addEventListener("click", function () {
    errorEl.textContent = "";
    try {
      canvas.toBlob(function (blob) {
        try {
          if (!blob) {
            errorEl.textContent = "画像を作れませんでした。ページを開き直してもう一度お試しください。";
            return;
          }
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = "sns-announce-1080.png";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        } catch (err) {
          errorEl.textContent = "画像を保存できませんでした。プレビュー画像を長押し（右クリック）して保存してください。";
        }
      }, "image/png");
    } catch (err) {
      errorEl.textContent = "画像を作れませんでした。ページを開き直してもう一度お試しください。";
    }
  });

  buildSwatches();
  draw();
})();
</script>
</body>
</html>
