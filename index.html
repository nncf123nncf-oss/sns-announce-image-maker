<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNS告知画像メーカー</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #C9DED8;
    --surface: #FFFFFF;
    --text: #1E332E;
    --text-sub: #3F5651;
    --accent: #2F6B5C;
    --danger: #C0392B;
    --border: #B7D1CA;
  }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lead { font-size: 14px; color: var(--text-sub); margin: 0 0 24px; }
  .field { margin-bottom: 16px; }
  label, .group-label { display: block; font-size: 14px; color: var(--text-sub); margin-bottom: 8px; }
  .hint { font-size: 12px; color: var(--text-sub); margin: 8px 0 0; }
  input[type="text"], textarea {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
  }
  textarea { min-height: 88px; resize: vertical; }
  .preview { margin-bottom: 16px; }
  canvas {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
  }
  .swatches {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .swatch {
    aspect-ratio: 1 / 1;
    min-height: 44px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0;
    cursor: pointer;
  }
  .swatch[aria-pressed="true"] {
    box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 6px var(--text);
  }
  .swatch:focus-visible, .toggle button:focus-visible, #download:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .toggle { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .toggle button {
    min-height: 44px;
    font-family: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
  }
  .toggle button[aria-pressed="true"] {
    box-shadow: inset 0 0 0 3px var(--accent);
    color: var(--accent);
    font-weight: 700;
  }
  .chip {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-right: 8px;
    vertical-align: -3px;
  }
  #download {
    display: block;
    width: 100%;
    min-height: 44px;
    margin-top: 24px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    color: var(--surface);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    cursor: pointer;
  }
  #error { color: var(--danger); font-size: 14px; margin: 8px 0 0; min-height: 0; }
  footer { margin-top: 24px; font-size: 12px; color: var(--text-sub); }
</style>
</head>
<body>
<div class="wrap">
  <h1>SNS告知画像メーカー</h1>
  <p class="lead">告知文・日付・店名を入れると、SNSにそのまま出せる正方形（1080×1080）の告知画像を作れます。</p>

  <div class="field">
    <label for="message">告知文（1行12文字で折り返し・最大6行）</label>
    <textarea id="message" placeholder="例: 本日は臨時休業いたします">本日は臨時休業いたします</textarea>
    <p class="hint">6行を超えた分は画像に入りません（末尾が「…」になります）。</p>
  </div>

  <div class="field">
    <label for="date">日付（20文字まで）</label>
    <input type="text" id="date" maxlength="20" placeholder="例: 9月5日（土）" value="9月5日（土）">
  </div>

  <div class="field">
    <label for="shop">店名（20文字まで）</label>
    <input type="text" id="shop" maxlength="20" placeholder="例: サンプル商店" value="サンプル商店">
  </div>

  <div class="preview">
    <canvas id="canvas" width="1080" height="1080" role="img" aria-label="告知画像のプレビュー"></canvas>
  </div>

  <div class="field">
    <span class="group-label" id="bg-label">背景色</span>
    <div class="swatches" id="swatches" role="group" aria-labelledby="bg-label"></div>
  </div>

  <div class="field">
    <span class="group-label" id="fg-label">文字色</span>
    <div class="toggle" id="toggle" role="group" aria-labelledby="fg-label">
      <button type="button" data-color="#FFFFFF" aria-pressed="true"><span class="chip" style="background:#FFFFFF"></span>白</button>
      <button type="button" data-color="#111111" aria-pressed="false"><span class="chip" style="background:#111111"></span>黒</button>
    </div>
  </div>

  <button type="button" id="download">画像をダウンロード（PNG）</button>
  <p class="hint">保存できないときは、上のプレビュー画像を長押し（パソコンでは右クリック）して保存してください。</p>
  <p id="error" role="status"></p>

  <footer>入力内容はこのページの中だけで処理され、どこにも送信・保存されません。</footer>
</div>

<script>
(function () {
  "use strict";

  var BG_COLORS = [
    { hex: "#E85D4C", name: "テラコッタ赤" },
    { hex: "#2F6B5C", name: "深緑" },
    { hex: "#3E5C8C", name: "紺" },
    { hex: "#F2A93C", name: "マスタード黄" },
    { hex: "#2A2A2E", name: "ほぼ黒" }
  ];

  var SIZE = 1080;
  var CHARS_PER_LINE = 12;
  var MAX_LINES = 6;
  var MAX_META_CHARS = 20;
  var MSG_FONT = 64;
  var META_FONT = 48;
  var LINE_HEIGHT = 90;
  var MSG_CENTER_Y = 440;
  var DATE_Y = 880;
  var SHOP_Y = 960;

  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");
  var messageEl = document.getElementById("message");
  var dateEl = document.getElementById("date");
  var shopEl = document.getElementById("shop");
  var swatchesEl = document.getElementById("swatches");
  var toggleEl = document.getElementById("toggle");
  var downloadEl = document.getElementById("download");
  var errorEl = document.getElementById("error");

  var state = { bg: BG_COLORS[0].hex, fg: "#FFFFFF" };

  // 絵文字などのサロゲートペアを分断しないよう、コードポイント単位の配列にする
  function toChars(text) {
    return Array.from(String(text));
  }

  // 告知文を「1行12文字」の固定ルールで分割する（改行はそのまま行区切りとして扱う）
  function wrapLines(text) {
    var lines = [];
    var paragraphs = String(text).split(/\r?\n/);
    for (var p = 0; p < paragraphs.length && lines.length <= MAX_LINES; p++) {
      var chars = toChars(paragraphs[p]);
      if (chars.length === 0) {
        lines.push("");
        continue;
      }
      for (var i = 0; i < chars.length && lines.length <= MAX_LINES; i += CHARS_PER_LINE) {
        lines.push(chars.slice(i, i + CHARS_PER_LINE).join(""));
      }
    }
    if (lines.length > MAX_LINES) {
      lines = lines.slice(0, MAX_LINES);
      var last = toChars(lines[MAX_LINES - 1]);
      lines[MAX_LINES - 1] = last.slice(0, Math.max(0, CHARS_PER_LINE - 1)).join("") + "…";
    }
    return lines;
  }

  function clampMeta(text) {
    var chars = toChars(text);
    return chars.length > MAX_META_CHARS ? chars.slice(0, MAX_META_CHARS).join("") : chars.join("");
  }

  function draw() {
    ctx.fillStyle = state.bg;
    ctx.fillRect(0, 0, SIZE, SIZE);

    ctx.fillStyle = state.fg;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    var lines = wrapLines(messageEl.value);
    var blockTop = MSG_CENTER_Y - ((lines.length - 1) * LINE_HEIGHT) / 2;
    ctx.font = "bold " + MSG_FONT + "px system-ui, -apple-system, 'Segoe UI', sans-serif";
    for (var i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], SIZE / 2, blockTop + i * LINE_HEIGHT);
    }

    ctx.font = META_FONT + "px system-ui, -apple-system, 'Segoe UI', sans-serif";
    var dateText = clampMeta(dateEl.value);
    var shopText = clampMeta(shopEl.value);
    ctx.fillText(dateText, SIZE / 2, DATE_Y);
    ctx.fillText(shopText, SIZE / 2, SHOP_Y);

    canvas.setAttribute("aria-label",
      "告知画像のプレビュー: " + lines.join(" ") + " " + dateText + " " + shopText);
  }

  function buildSwatches() {
    for (var i = 0; i < BG_COLORS.length; i++) {
      (function (color) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "swatch";
        b.style.background = color.hex;
        b.setAttribute("aria-label", color.name);
        b.setAttribute("aria-pressed", color.hex === state.bg ? "true" : "false");
        b.addEventListener("click", function () {
          state.bg = color.hex;
          var all = swatchesEl.querySelectorAll(".swatch");
          for (var j = 0; j < all.length; j++) {
            all[j].setAttribute("aria-pressed", all[j] === b ? "true" : "false");
          }
          draw();
        });
        swatchesEl.appendChild(b);
      })(BG_COLORS[i]);
    }
  }

  toggleEl.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("button[data-color]") : null;
    if (!btn) { return; }
    state.fg = btn.getAttribute("data-color");
    var all = toggleEl.querySelectorAll("button[data-color]");
    for (var j = 0; j < all.length; j++) {
      all[j].setAttribute("aria-pressed", all[j] === btn ? "true" : "false");
    }
    draw();
  });

  messageEl.addEventListener("input", draw);
  dateEl.addEventListener("input", draw);
  shopEl.addEventListener("input", draw);

  downloadEl.addEventListener("click", function () {
    errorEl.textContent = "";
    try {
      canvas.toBlob(function (blob) {
        try {
          if (!blob) {
            errorEl.textContent = "画像を作れませんでした。ページを開き直してもう一度お試しください。";
            return;
          }
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = "sns-announce-1080.png";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        } catch (err) {
          errorEl.textContent = "画像を保存できませんでした。プレビュー画像を長押し（右クリック）して保存してください。";
        }
      }, "image/png");
    } catch (err) {
      errorEl.textContent = "画像を作れませんでした。ページを開き直してもう一度お試しください。";
    }
  });

  buildSwatches();
  draw();
})();
</script>
</body>
</html>
